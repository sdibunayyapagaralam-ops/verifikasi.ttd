
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Dokumen — SD Islam Bunayya</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --hijau: #1a6b45;
    --hijau-muda: #2d9566;
    --hijau-terang: #e8f5ee;
    --emas: #b8922a;
    --emas-muda: #f5e9c8;
    --abu: #6b7280;
    --bg: #f8f7f4;
    --putih: #ffffff;
    --teks: #1a1a1a;
    --border: #e2ddd5;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .kartu {
    background: var(--putih);
    border-radius: 20px;
    max-width: 520px;
    width: 100%;
    overflow: hidden;
    box-shadow: 0 4px 40px rgba(26,107,69,.10);
    border: 1px solid var(--border);
  }

  .header {
    background: var(--hijau);
    padding: 2rem 2rem 1.5rem;
    text-align: center;
    position: relative;
  }

  .header::after {
    content: '';
    display: block;
    width: 60px;
    height: 3px;
    background: var(--emas);
    margin: 1rem auto 0;
    border-radius: 2px;
  }

  .logo-lingkaran {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--putih);
    margin: 0 auto 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid var(--emas);
    overflow: hidden;
    font-family: 'Amiri', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--hijau);
    letter-spacing: -1px;
  }

  .logo-lingkaran img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  .logo-lingkaran img.loaded { display: block; }

  .nama-sekolah {
    font-family: 'Amiri', serif;
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.3;
    margin-bottom: .25rem;
  }

  .sub-sekolah {
    font-size: 12px;
    color: rgba(255,255,255,.7);
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .badge-sah {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--hijau-terang);
    color: var(--hijau);
    border: 1.5px solid var(--hijau-muda);
    border-radius: 100px;
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 600;
    margin: 1.5rem auto .5rem;
  }

  .badge-sah svg { flex-shrink: 0; }

  .badge-invalid {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fef2f2;
    color: #dc2626;
    border: 1.5px solid #fca5a5;
    border-radius: 100px;
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 600;
    margin: 1.5rem auto .5rem;
  }

  .isi {
    padding: 1.75rem 2rem 2rem;
  }

  .seksi-judul {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--emas);
    margin-bottom: .75rem;
    padding-bottom: .5rem;
    border-bottom: 1px solid var(--emas-muda);
  }

  .baris {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
    padding: .6rem 0;
    border-bottom: 1px solid #f0ede8;
  }

  .baris:last-child { border-bottom: none; }

  .label {
    font-size: 12px;
    color: var(--abu);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .nilai {
    font-size: 13px;
    font-weight: 500;
    color: var(--teks);
    text-align: right;
  }

  .penandatangan-blok {
    background: var(--hijau-terang);
    border: 1px solid #b7dfc9;
    border-radius: 12px;
    padding: 1.25rem;
    margin: 1.25rem 0 0;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--hijau);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 600;
    flex-shrink: 0;
    font-family: 'Amiri', serif;
  }

  .nama-ttd {
    font-size: 15px;
    font-weight: 600;
    color: var(--hijau);
  }

  .jabatan-ttd {
    font-size: 12px;
    color: var(--abu);
    margin-top: 2px;
  }

  .footer {
    text-align: center;
    padding: 1rem 2rem 1.5rem;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: #9ca3af;
    line-height: 1.6;
  }

  .timestamp {
    font-size: 11px;
    color: #9ca3af;
    text-align: center;
    margin-top: 1rem;
    padding-top: .75rem;
    border-top: 1px solid #f0ede8;
  }

  .tidak-ditemukan {
    text-align: center;
    padding: 3rem 2rem;
  }

  .tidak-ditemukan .ikon {
    font-size: 48px;
    margin-bottom: 1rem;
  }

  .loading {
    text-align: center;
    padding: 3rem 2rem;
    color: var(--abu);
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="kartu" id="kartu">
  <div class="loading">Memuat data dokumen...</div>
</div>

<script>
function getParams() {
  const p = new URLSearchParams(window.location.search);
  return {
    no: p.get('no') || '',
    hal: p.get('hal') || '',
    tgl: p.get('tgl') || '',
    ttd: p.get('ttd') || '',
    jbt: p.get('jbt') || '',
    ts: p.get('ts') || ''
  };
}

function formatTanggal(d) {
  if (!d) return '-';
  const bulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const [y, m, day] = d.split('-');
  return parseInt(day) + ' ' + bulan[parseInt(m)-1] + ' ' + y;
}

function inisial(nama) {
  return nama.split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase();
}

function formatTS(ts) {
  if (!ts) return '';
  const d = new Date(parseInt(ts));
  if (isNaN(d)) return '';
  return d.toLocaleString('id-ID', {day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'});
}
