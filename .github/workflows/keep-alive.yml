name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 3 * * 1,4'   # Senin & Kamis, 03:00 UTC (~10:00 WIB)
  workflow_dispatch:         # bisa dijalankan manual dari tab "Actions"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf -o /dev/null \
            "https://dmemwgvqyjetanrhpqwg.supabase.co/rest/v1/dokumen?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
          echo "✅ Ping berhasil, proyek Supabase tetap aktif."
